<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | MLA Shop</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(90deg, #09634f, #0fa67a);
            padding: 16px 32px;
        }
    .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            color: #fff;
            font-size: 28px;
        }

        .navbar p {
            color: #e0f2ec;
            font-size: 14px;
        }

        nav a {
            color: #ffffff;
            margin-left: 16px;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ffdd57;
        }

        main {
            flex: 1;
            padding: 40px 32px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contact-box {
            background: #fff;
            width: 100%;
            max-width: 600px;
            padding: 32px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .contact-box h2 {
            text-align: center;
            color: #09634f;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .contact-box p {
            text-align: center;
            font-size: 16px;
            margin-bottom: 24px;
            color: #444;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        textarea {
            resize: none;
            height: 120px;
        }

        button {
            width: 100%;
            background: #09634f;
            color: white;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0fa67a;
        }

        footer {
            background: #09634f;
            color: #fff;
            text-align: center;
            padding: 16px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <div class="navbar">
        <div>
            <h1>MLA Shop</h1>
            <p>Quality products for everyday life</p>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html">Products</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<main>
    <section class="contact-box">
        <h2>Contact Us</h2>
        <p>Have any questions? Feel free to send us a message.</p>

        <form>
            <label for="name">Your Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="message">Message</label>
            <textarea id="message" placeholder="Write your message here..." required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </section>
</main>

<footer>
    <p>© 2026 MLA Shop | All Rights Reserved</p>
</footer>

</body>
</html>
