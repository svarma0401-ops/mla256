<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>
</head>
<body>
    <h1>Player Data</h1>
    <table cellpadding="5" cellspacing="0" border="1" align="center">
        <caption>Player Information</caption>
        <tr>
            <th class="center" colspan="2" rowspan="2">ID</th>
            <th class="center" rowspan="2">Full <br>Name</th>
            <th class="center" colspan="2">All Rounder</th>
            <th class="center" >Team</th>

        </tr>
        <tr>
            <td>
                <table border="2px">
                    <tr>
                        <th class="center">City</th>
                        <th class="center">Country</th>
                    </tr>
                    <tr>
                        <td align="right">Hyd</td>
                        <td align="right">India</td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <th>Data</th>
            <td align="right">001</td>
            <td align="right">Rohit Sharma</td>
            <td align="right">Yes</td>
            <td align="right">India</td>
        </tr>
    </table>
</body>
</html>
