<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Page</title>

<style>
    /* ===== Base ===== */
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #f1f5f9;
        color: #333;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* ===== Header ===== */
    header {
        background: linear-gradient(90deg, #1e3a8a, #2563eb);
        color: white;
        padding: 25px;
        text-align: center;
    }

    /* ===== Navigation ===== */
    .nav {
        background-color: white;
        padding: 12px 20px;
        text-align: right;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .nav a {
        display: inline-block;
        padding: 8px 16px;
        margin-left: 10px;
        border-radius: 6px;
        text-decoration: none;
        color: #1e3a8a;
        font-weight: 600;
        transition: 0.3s;
    }

    .nav a:hover {
        background-color: #2563eb;
        color: white;
    }

    /* ===== Products Section ===== */
    .content {
        flex: 1;
    }

    .product-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 25px;
        padding: 40px 20px;
    }

    .product {
        background-color: white;
        width: 220px;
        border-radius: 12px;
        padding: 18px;
        text-align: center;
        box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .product:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 25px rgba(0,0,0,0.15);
    }

    .product object {
        width: 100%;
        height: 160px;
        border-radius: 8px;
    }

    .product p {
        margin-top: 12px;
        font-size: 17px;
        font-weight: bold;
        color: #1e3a8a;
    }

    /* ===== Footer ===== */
    footer {
        background-color: #1e293b;
        color: white;
        text-align: center;
        padding: 14px;
    }
</style>

</head>
<body>

<header>
    <h1>Custom Website</h1>
    <h3>MLA CODERS</h3>
</header>

<div class="nav">
    <a href="home.html">Home</a>
    <a href="products.html">Products</a>
    <a href="services.html">Services</a>
    <a href="login.html">SignIn</a>
    <a href="register.html">SignUp</a>
</div>

<div class="content">

    <div class="product-row">

        <div class="product">
            <object data="bat.jpg"></object>
            <p>Cricket Bat</p>
        </div>

        <div class="product">
            <object data="jersey.jpg"></object>
            <p>Cricket Jersey</p>
        </div>

        <div class="product">
            <object data="kit.jpg"></object>
            <p>Cricket Kit</p>
        </div>

        <div class="product">
            <object data="gloves.jpg"></object>
            <p>Batting Gloves</p>
        </div>

        <!-- New Image Tab 2 -->
        <div class="product">
            <object data="helmet.jpeg"></object>
            <p>Cricket Helmet</p>
        </div>

    </div>

</div>

<footer>
    <p>© 2026 MLA CODERS | All Rights Reserved</p>
</footer>

</body>
</html>
